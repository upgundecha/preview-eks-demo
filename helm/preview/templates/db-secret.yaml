# The password is generated once, in-cluster, by External Secrets Operator.
# It never appears in Git, and later syncs do not rotate it, so the existing
# PostgreSQL volume keeps working when the PR is updated.
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: preview-db-password
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  length: 32
  digits: 8
  symbols: 0
  noUpper: false
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.database.passwordSecret }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshPolicy: CreatedOnce
  target:
    name: {{ .Values.database.passwordSecret }}
    creationPolicy: Owner
    immutable: true
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: preview-db-password
