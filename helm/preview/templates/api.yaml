apiVersion: v1
kind: Service
metadata:
  name: preview-api
spec:
  selector:
    app: preview-api
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: preview-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: preview-api
  template:
    metadata:
      labels:
        app: preview-api
    spec:
      automountServiceAccountToken: false
      containers:
        - name: java-api
          image: {{ required "api.image must be provided" .Values.api.image | quote }}
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: APP_ENVIRONMENT_ID
              value: {{ required "preview.id must be provided" .Values.preview.id | quote }}
            - name: APP_VERSION
              value: {{ required "preview.version must be provided" .Values.preview.version | quote }}
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://preview-db:5432/preview
            - name: SPRING_DATASOURCE_USERNAME
              value: preview
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.passwordSecret }}
                  key: password
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /live
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests:
              cpu: 200m
              memory: 384Mi
            limits:
              cpu: 1000m
              memory: 768Mi
