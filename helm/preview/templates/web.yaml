apiVersion: v1
kind: Service
metadata:
  name: preview-web
spec:
  selector:
    app: preview-web
  ports:
    - name: http
      port: 80
      targetPort: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: preview-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: preview-web
  template:
    metadata:
      labels:
        app: preview-web
    spec:
      automountServiceAccountToken: false
      containers:
        - name: web
          image: {{ required "web.image must be provided" .Values.web.image | quote }}
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
