services:
  db:
    image: postgres:17.12-alpine3.24
    environment:
      POSTGRES_DB: preview
      POSTGRES_USER: preview
      POSTGRES_PASSWORD: local-demo-only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U preview -d preview"]
      interval: 3s
      retries: 15
    volumes:
      - preview-data:/var/lib/postgresql/data

  api:
    build: ./backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/preview
      SPRING_DATASOURCE_USERNAME: preview
      SPRING_DATASOURCE_PASSWORD: local-demo-only
      APP_ENVIRONMENT_ID: local-compose
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./frontend
    ports:
      - "8080:80"
    volumes:
      - ./frontend/nginx.local.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api

volumes:
  preview-data:
