name: Feature branch preview

# GitOps flow: this workflow only builds images and opts the PR in. Argo CD's
# ApplicationSet (gitops/argocd) sees the labelled PR and deploys it, and
# removes the preview when the PR closes. Nothing here can reach the cluster.
on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: branch-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      id-token: write
    env:
      # Argo CD derives the same tag from the PR generator's head_sha.
      IMAGE_TAG: pr-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Check React build
        working-directory: frontend
        run: npm install --no-audit --no-fund && npm run build
      - name: Check Java build
        run: mvn -B -ntp -f backend/pom.xml verify
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ vars.AWS_REGION }}
          role-to-assume: ${{ vars.GH_ROLE_ARN }}
      - uses: aws-actions/amazon-ecr-login@v2
      # Tags are immutable, so a re-run for the same commit reuses what is there.
      - name: Check for existing images
        id: existing
        run: |
          for name in web api; do
            repo_url_var="${name^^}_ECR_URL"
            repo="${!repo_url_var##*/}"
            if aws ecr describe-images --repository-name "$repo" \
                 --image-ids imageTag="$IMAGE_TAG" >/dev/null 2>&1; then
              echo "$name=true" >> "$GITHUB_OUTPUT"
            else
              echo "$name=false" >> "$GITHUB_OUTPUT"
            fi
          done
        env:
          WEB_ECR_URL: ${{ vars.WEB_ECR_URL }}
          API_ECR_URL: ${{ vars.API_ECR_URL }}
      - name: Build and push React
        if: steps.existing.outputs.web != 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: ${{ vars.WEB_ECR_URL }}:${{ env.IMAGE_TAG }}
      - name: Build and push Java
        if: steps.existing.outputs.api != 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ${{ vars.API_ECR_URL }}:${{ env.IMAGE_TAG }}

  # Labelling only after the images exist keeps Argo CD from creating a
  # preview that would sit in ImagePullBackOff.
  opt-in:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
      issues: write
    steps:
      - name: Add the preview label
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST \
            "repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/labels" \
            -f 'labels[]=preview' >/dev/null

  # Read-only check from outside the cluster: wait until the public URL serves
  # this exact commit, then publish it as the PR's "View deployment" link.
  verify:
    needs: opt-in
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      deployments: write
    environment:
      name: preview-${{ github.event.pull_request.number }}
      url: https://pr-${{ github.event.pull_request.number }}.${{ vars.PREVIEW_DOMAIN }}/
    steps:
      - name: Wait for Argo CD to roll out this commit
        env:
          HOST: pr-${{ github.event.pull_request.number }}.${{ vars.PREVIEW_DOMAIN }}
          ENVIRONMENT: preview-${{ github.event.pull_request.number }}
          VERSION: ${{ github.event.pull_request.head.sha }}
        run: |
          for attempt in $(seq 1 165); do
            if curl -fsS --max-time 5 "https://${HOST}/api/visits" \
                 | jq -e --arg env "$ENVIRONMENT" --arg ver "$VERSION" \
                     '.environment == $env and .version == $ver and (.visits | type) == "number"' >/dev/null \
               && curl -fsS --max-time 5 "https://${HOST}/" | grep -q '/assets/'; then
              echo "Preview is serving ${VERSION}: https://${HOST}/"
              printf '### Branch preview\n\n[%s](https://%s/) · %s · `%s`\n' \
                "$HOST" "$HOST" "$ENVIRONMENT" "${VERSION:0:7}" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 10
          done
          echo "https://${HOST}/ is not serving ${VERSION}. Check the preview-${{ github.event.pull_request.number }} Application in Argo CD." >&2
          exit 1
